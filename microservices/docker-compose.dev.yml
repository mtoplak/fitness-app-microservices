services:
  # Kong Database
  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5432:5432"
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Kong Migrations
  kong-migrations:
    image: kong:3.4.2
    container_name: kong-migrations
    command: sh -c "kong migrations bootstrap && kong migrations up && kong migrations finish"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - fitness-network
    restart: on-failure

  # Kong Gateway
  kong:
    image: kong:3.4.2
    container_name: kong-gateway
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:9000
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8444:8444"
    networks:
      - fitness-network
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB za User Service
  mongo-users:
    image: mongo:7
    container_name: mongo-users
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_users
    volumes:
      - mongo-users-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo-group-bookings:
    image: mongo:7
    container_name: mongo-group-bookings
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_group_bookings
    volumes:
      - mongo-group-bookings-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== MICROSERVICES ==========
  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongo-users:27017/fitness_users?authSource=admin
      JWT_SECRET: dev-secret-key
      PORT: 3001
      NODE_ENV: development
    depends_on:
      mongo-users:
        condition: service_healthy
    networks:
      - fitness-network

  # Subscription Service
  mongo-subscriptions:
    image: mongo:7
    container_name: mongo-subscriptions
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_subscriptions
    volumes:
      - mongo-subscriptions-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: Dockerfile.dev
    container_name: subscription-service
    ports:
      - "3002:3002"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongo-subscriptions:27017/fitness_subscriptions?authSource=admin
      JWT_SECRET: dev-secret-key
      PORT: 3002
      ASPNETCORE_URLS: http://+:3002
      ASPNETCORE_ENVIRONMENT: Development
      NODE_ENV: development
    depends_on:
      mongo-subscriptions:
        condition: service_healthy
    networks:
      - fitness-network

  # Trainer Booking Service
  mongo-trainer-bookings:
    image: mongo:7
    container_name: mongo-trainer-bookings
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_trainer_bookings
    volumes:
      - mongo-trainer-bookings-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  trainer-booking-service:
    build:
      context: ./trainer-booking-service
      dockerfile: Dockerfile.dev
    container_name: trainer-booking-service
    ports:
      - "3003:3003"
    environment:
      DatabaseSettings__ConnectionString: mongodb://admin:admin123@mongo-trainer-bookings:27017/fitness_trainer_bookings?authSource=admin
      DatabaseSettings__DatabaseName: fitness_trainer_bookings
      ASPNETCORE_URLS: http://+:3003
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      mongo-trainer-bookings:
        condition: service_healthy
    networks:
      - fitness-network

  # Workout Schedule Service
  mongo-workout-schedules:
    image: mongo:7
    container_name: mongo-workout-schedules
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_workout_schedules
    volumes:
      - mongo-workout-schedules-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  workout-schedule-service:
    build:
      context: ./workout-schedule-service
      dockerfile: Dockerfile
    container_name: workout-schedule-service
    ports:
      - "3004:3004"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongo-workout-schedules:27017/fitness_workout_schedules?authSource=admin
      JWT_SECRET: dev-secret-key
      PORT: 3004
      NODE_ENV: development
    depends_on:
      mongo-workout-schedules:
        condition: service_healthy
    networks:
      - fitness-network

  # Group Class Booking Service
  mongo-group-class-bookings:
    image: mongo:7
    container_name: mongo-group-class-bookings
    ports:
      - "27022:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_group_class_bookings
    volumes:
      - mongo-group-class-bookings-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  group-class-booking-service:
    build:
      context: ./group-class-booking-service
      dockerfile: Dockerfile
    container_name: group-class-booking-service
    ports:
      - "3005:3005"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongo-group-class-bookings:27017/fitness_group_class_bookings?authSource=admin
      JWT_SECRET: dev-secret-key
      PORT: 3005
      NODE_ENV: development
    depends_on:
      mongo-group-class-bookings:
        condition: service_healthy
    networks:
      - fitness-network

  # Admin Reporting Service
  mongo-admin-reports:
    image: mongo:7
    container_name: mongo-admin-reports
    ports:
      - "27023:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: fitness_admin_reports
    volumes:
      - mongo-admin-reports-data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-reporting-service:
    build:
      context: ./admin-reporting-service
      dockerfile: Dockerfile
    container_name: admin-reporting-service
    ports:
      - "3006:3006"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongo-admin-reports:27017/fitness_admin_reports?authSource=admin
      JWT_SECRET: dev-secret-key
      PORT: 3006
      NODE_ENV: development
    depends_on:
      mongo-admin-reports:
        condition: service_healthy
    networks:
      - fitness-network

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    networks:
      - fitness-network
    depends_on:
      - kong

  # Kong Configurator - runs once to set up routes
  kong-configurator:
    image: curlimages/curl:latest
    container_name: kong-configurator
    networks:
      - fitness-network
    depends_on:
      kong:
        condition: service_healthy
      user-service:
        condition: service_started
      subscription-service:
        condition: service_started
      trainer-booking-service:
        condition: service_started
      workout-schedule-service:
        condition: service_started
      group-class-booking-service:
        condition: service_started
      admin-reporting-service:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "⏳ Waiting for services to be ready..."
        sleep 10
        
        echo "🔧 Configuring Kong routes..."
        KONG_ADMIN="http://kong:8001"
        
        # Delete existing routes
        for route_id in $$(curl -s $$KONG_ADMIN/routes 2>/dev/null | grep -o '"id":"[^"]*"' | cut -d'"' -f4); do
          curl -s -X DELETE "$$KONG_ADMIN/routes/$$route_id" > /dev/null 2>&1
        done
        
        # Create routes
        curl -s -X POST "$$KONG_ADMIN/services/user-service/routes" \
          --data "name=user-routes" \
          --data "paths[]=/api/users" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/user-service/routes" \
          --data "name=user-admin-routes" \
          --data "paths[]=/api/admin/members" \
          --data "paths[]=/api/admin/trainers" \
          --data "paths[]=/api/admin/users" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/subscription-service/routes" \
          --data "name=subscription-routes" \
          --data "paths[]=/api/subscriptions" \
          --data "paths[]=/api/memberships" \
          --data "paths[]=/api/packages" \
          --data "paths[]=/api/plans" \
          --data "paths[]=/api/payments" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/trainer-booking-service/routes" \
          --data "name=trainer-booking-routes" \
          --data "paths[]=/api/trainers" \
          --data "paths[]=/api/trainer-bookings" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/workout-schedule-service/routes" \
          --data "name=workout-schedule-routes" \
          --data "paths[]=/api/workout-schedules" \
          --data "paths[]=/api/schedules" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/group-class-booking-service/routes" \
          --data "name=group-class-booking-routes" \
          --data "paths[]=/api/classes" \
          --data "paths[]=/api/class-bookings" \
          --data "strip_path=false" > /dev/null
        
        curl -s -X POST "$$KONG_ADMIN/services/admin-reporting-service/routes" \
          --data "name=admin-reporting-routes" \
          --data "paths[]=/api/reports" \
          --data "paths[]=/api/admin/dashboard" \
          --data "paths[]=/api/admin/stats" \
          --data "paths[]=/api/admin/export" \
          --data "strip_path=false" > /dev/null
        
        echo "✅ Kong routes configured successfully!"
        
        echo "🌐 Configuring CORS plugin..."
        # Enable CORS globally for all routes
        curl -s -X POST "$$KONG_ADMIN/plugins" \
          --data "name=cors" \
          --data "config.origins=http://localhost:8080" \
          --data "config.origins=http://localhost:3000" \
          --data "config.methods=GET" \
          --data "config.methods=POST" \
          --data "config.methods=PUT" \
          --data "config.methods=PATCH" \
          --data "config.methods=DELETE" \
          --data "config.methods=OPTIONS" \
          --data "config.headers=Accept" \
          --data "config.headers=Accept-Version" \
          --data "config.headers=Content-Length" \
          --data "config.headers=Content-MD5" \
          --data "config.headers=Content-Type" \
          --data "config.headers=Date" \
          --data "config.headers=Authorization" \
          --data "config.headers=X-Auth-Token" \
          --data "config.exposed_headers=X-Auth-Token" \
          --data "config.credentials=true" \
          --data "config.max_age=3600" > /dev/null
        
        echo "✅ CORS configured successfully!"
        echo "Routes:"
        curl -s $$KONG_ADMIN/routes | grep -o '"name":"[^"]*"' | cut -d'"' -f4

volumes:
  kong-db-data:
  mongo-users-data:
  mongo-group-bookings-data:
  mongo-subscriptions-data:
  mongo-trainer-bookings-data:
  mongo-workout-schedules-data:
  mongo-group-class-bookings-data:
  mongo-admin-reports-data:
networks:
  fitness-network:
    driver: bridge
